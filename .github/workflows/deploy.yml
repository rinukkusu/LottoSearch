name: Build & deploy

on:
  schedule:
    - cron: '0 5 * * *' # daily, after the Sunday/Wednesday/Friday draws are published
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download draws and compile data/draws.js
        run: node scripts/build.mjs

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/draws.js _site/data/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
